<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style> 
        table{
            font-family: Arial, Helvetica, sans-serif;
            width: 300px;
            border-collapse: collapse;
        }
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem</h1>

    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td> <!-- colspan serve para expandir em colunas-->
           
        </tr>
        <tr>
            <td rowspan="2">x</td><!-- rowspan serve para expandir em linhas.. OBS: SCOPE é rowgroup, pois nessa celula vai passar mais linhas com informaçoes relativas a esta linha, se fosse colunas com varias colunas o SCOPE seria colgroup... serve para a pesquisa no google--> 
            <td>E</td>
            <td rowspan="3">F</td>
        </tr>
        <tr>
            
            <td>H</td>
           
        </tr>
        <tr>
            
            <td>L</td>
            <td>M</td>
        </tr>
    </table>
    
</body>
</html>
